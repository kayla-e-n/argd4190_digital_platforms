<!DOCTYPE html>
<html lang="en">

<head>
    <title>User Input Assignment</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
<p>
  <label for="word-input">text</label>
  <input id="word-input" type="text" placeholder="enter something" />
  
</p>

<p>
  <label for="left-eye-x">left eye x</label>
  <input id="left-eye-x" type="range" min="0" max="400" value="100" />
  <label for="left-eye-y">left eye y</label>
  <input id="left-eye-y" type="range" min="0" max="400" value="110" />
</p>

<p>
  <label for="right-eye-x">right eye x</label>
  <input id="right-eye-x" type="range" min="0" max="400" value="200" />
  <label for="right-eye-y">right eye y</label>
  <input id="right-eye-y" type="range" min="0" max="400" value="110" />
</p>

<p>
  <label for="mouth-scale">mouth scale</label>
  <input id="mouth-scale" type="range" min="0.1" max="3" step="0.1" value="1" />
  <output for="mouth-scale"></output>
</p>

<div id="bg">
  <img id="ghostBody" src="ghost-body.png"></img>
  <img id="leftEye" src="left-eye.png"></img>
  <img id="rightEye" src="right-eye.png"></img>
  <img id="mouth" src="mouth.png"></img>
  <h1 id="word">BOO</h1>
</div>
<script src="javas.js"></script>
</body>
</html>
